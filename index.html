<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#111318" />
<title>AVM Bus</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
:root{--bg:#0f1115;--panel:#191d24;--panel2:#222833;--orange:#ff8a00;--text:#f7f7f7;--muted:#aeb6c3;--ok:#31d17c;--bad:#ff5555;--warn:#ffbf47}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input{font:inherit} button{touch-action:manipulation;cursor:pointer}.top{height:66px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0a0c10;border-bottom:2px solid var(--orange);position:sticky;top:0;z-index:1000}.brand{font-weight:900;color:var(--orange);font-size:22px;margin-right:auto}.btn{border:1px solid #394150;background:var(--panel2);color:white;border-radius:10px;padding:11px 14px;font-weight:800}.btn.orange{background:var(--orange);border-color:var(--orange);color:#111}.btn.red{background:#7e2020;border-color:#a93434}.page{display:none;padding:16px}.page.active{display:block}.drive{display:grid;grid-template-columns:40% 60%;gap:16px;min-height:calc(100vh - 98px)}.card{background:var(--panel);border:1px solid #2b313d;border-radius:16px;padding:18px}.stopList{display:flex;flex-direction:column;gap:10px}.stopItem{padding:15px;border-radius:11px;background:#222833;border-left:5px solid #576171}.stopItem.next{border-color:var(--orange);background:#332617}.hero{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.hero small{font-size:18px;color:var(--muted);font-weight:800}.nextName{font-size:clamp(38px,6vw,78px);font-weight:950;line-height:1.05;color:var(--orange);margin:12px 0}.delta{font-size:clamp(24px,3vw,38px);font-weight:900}.delta.late{color:var(--bad)}.delta.early{color:#64b5ff}.delta.ontime{color:var(--ok)}.sub{color:var(--muted);margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input{background:#0f1319;color:white;border:1px solid #3b4351;border-radius:9px;padding:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.editStop{display:grid;grid-template-columns:1fr 150px 150px auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid #303743}.editStop input{width:100%;background:#0f1319;color:#fff;border:1px solid #3b4351;border-radius:8px;padding:10px}#map,#pickMap{height:calc(100vh - 150px);min-height:420px;border-radius:14px}.diag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.diagBox{background:var(--panel);padding:18px;border-radius:14px}.diagLabel{color:var(--muted);font-size:13px;text-transform:uppercase}.diagVal{font-size:22px;font-weight:850;margin-top:5px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.modal{display:none;position:fixed;inset:0;background:#000d;z-index:2000;padding:18px}.modal.open{display:flex;flex-direction:column}.modalBar{display:flex;align-items:center;gap:10px;margin-bottom:10px}.modalBar h2{margin:0 auto 0 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#232a35;color:#fff;padding:11px 16px;border-radius:10px;display:none;z-index:3000}@media(max-width:800px){.top{height:auto;flex-wrap:wrap}.brand{width:100%}.drive,.grid{grid-template-columns:1fr}.editStop{grid-template-columns:1fr 1fr}.editStop .name{grid-column:1/-1}.page{padding:10px}.nextName{font-size:40px}#map,#pickMap{height:60vh}.diag{grid-template-columns:1fr}.btn{padding:10px 11px}}
</style>
</head>
<body>
<header class="top"><div class="brand">AVM</div><button class="btn orange" onclick="showPage('avm')">AVM</button><button class="btn" onclick="showPage('mapPage')">MAPPA</button><button class="btn" onclick="showPage('lines')">LINEA</button><button class="btn" onclick="showPage('diagnostics')">DIAGNOSTICA</button><button id="audioBtn" class="btn" onclick="toggleAudio()">🔊 AUDIO ON</button></header>

<section id="avm" class="page active"><div class="drive"><div class="card"><h2>Prossime fermate</h2><div id="stopList" class="stopList"></div></div><div class="card hero"><small>PROSSIMA FERMATA</small><div id="nextName" class="nextName">Nessuna linea</div><div id="delta" class="delta ontime">--</div><div id="distance" class="sub">GPS in attesa...</div><div class="row" style="margin-top:24px;justify-content:center"><button class="btn" onclick="manualPrevStop()">◀ FERMATA PRECEDENTE</button><button class="btn orange" onclick="manualNextStop()">FERMATA SUCCESSIVA ▶</button></div></div></div></section>
<section id="mapPage" class="page"><div id="map"></div></section>
<section id="lines" class="page"><div class="grid"><div class="card"><h2>Crea / modifica linea</h2><div class="field"><label>Numero linea</label><input id="lineNo" value="1"></div><div class="field"><label>Direzione</label><input id="direction" value="Centro"></div><div class="row"><button class="btn orange" onclick="addStop()">+ AGGIUNGI FERMATA</button><button class="btn" onclick="saveLine()">SALVA LINEA</button><button class="btn red" onclick="clearLine()">AZZERA</button></div></div><div class="card"><h2>Fermate</h2><div id="editor"></div></div></div></section>
<section id="diagnostics" class="page"><h2>Diagnostica in tempo reale</h2><div class="diag"><div class="diagBox"><div class="diagLabel">GPS</div><div id="gpsState" class="diagVal warn">IN ATTESA</div></div><div class="diagBox"><div class="diagLabel">Ultimo aggiornamento</div><div id="gpsTime" class="diagVal">--</div></div><div class="diagBox"><div class="diagLabel">Latitudine</div><div id="gpsLat" class="diagVal">--</div></div><div class="diagBox"><div class="diagLabel">Longitudine</div><div id="gpsLon" class="diagVal">--</div></div><div class="diagBox"><div class="diagLabel">Precisione GPS</div><div id="gpsAcc" class="diagVal">--</div></div><div class="diagBox"><div class="diagLabel">Velocità</div><div id="gpsSpeed" class="diagVal">--</div></div><div class="diagBox"><div class="diagLabel">Permesso</div><div id="gpsPermission" class="diagVal">--</div></div><div class="diagBox"><div class="diagLabel">Audio</div><div id="audioState" class="diagVal ok">ATTIVO</div></div></div></section>

<div id="pickModal" class="modal"><div class="modalBar"><h2>Scegli posizione fermata</h2><button class="btn" onclick="closePicker()">ANNULLA</button><button class="btn orange" onclick="confirmPicker()">USA QUESTA POSIZIONE</button></div><div id="pickMap"></div></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const defaultLine={number:'1',direction:'Centro',stops:[{name:'Stazione',lat:45.1847,lon:9.1582,time:'08:00'},{name:'Centro',lat:45.1872,lon:9.1548,time:'08:05'},{name:'Ospedale',lat:45.1970,lon:9.1455,time:'08:12'}]};
let line=JSON.parse(localStorage.getItem('avmLine')||'null')||defaultLine; let manualStopIndex=null; let audio=localStorage.getItem('avmAudio')!=='off'; let pos=null, watchId=null, map, busMarker, routeLayer, stopLayers=[],pickMap,pickMarker,pickIndex=-1,picked=null,lastAnnounced='';
function $(id){return document.getElementById(id)} function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='mapPage'){setTimeout(()=>{initMap();map.invalidateSize();drawMap()},50)}if(id==='lines')renderEditor();}
function renderEditor(){$('lineNo').value=line.number;$('direction').value=line.direction;$('editor').innerHTML='';line.stops.forEach((s,i)=>{let d=document.createElement('div');d.className='editStop';d.innerHTML=`<div class="name"><label>Nome</label><input value="${esc(s.name)}" oninput="line.stops[${i}].name=this.value"></div><div><label>Latitudine</label><input value="${s.lat??''}" oninput="line.stops[${i}].lat=parseFloat(this.value)"></div><div><label>Longitudine</label><input value="${s.lon??''}" oninput="line.stops[${i}].lon=parseFloat(this.value)"></div><div class="row"><button class="btn orange" onclick="openPicker(${i})">📍 MAPPA</button><button class="btn red" onclick="removeStop(${i})">×</button></div>`;$('editor').appendChild(d)})}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function addStop(){line.stops.push({name:'Nuova fermata',lat:pos?.coords.latitude||45.1847,lon:pos?.coords.longitude||9.1582,time:''});renderEditor()}
function removeStop(i){line.stops.splice(i,1);renderEditor();renderAvm()}
function saveLine(){line.number=$('lineNo').value.trim();line.direction=$('direction').value.trim();localStorage.setItem('avmLine',JSON.stringify(line));renderEditor();renderAvm();if(map)drawMap();toast('Linea salvata nel browser')}
function clearLine(){if(confirm('Azzero la linea salvata?')){line={number:'',direction:'',stops:[]};saveLine()}}
function hav(a,b,c,d){const R=6371000,p=Math.PI/180,dp=(c-a)*p,dl=(d-b)*p,x=Math.sin(dp/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function nearestNext(){if(!line.stops.length)return -1;if(manualStopIndex!==null)return Math.max(0,Math.min(manualStopIndex,line.stops.length-1));if(!pos)return 0;let best=0,dist=Infinity;line.stops.forEach((s,i)=>{if(Number.isFinite(s.lat)&&Number.isFinite(s.lon)){let d=hav(pos.coords.latitude,pos.coords.longitude,s.lat,s.lon);if(d<dist){dist=d;best=i}}});return Math.min(best+(dist<35?1:0),line.stops.length-1)}
function manualPrevStop(){let i=nearestNext();manualStopIndex=Math.max(0,i-1);lastAnnounced='';renderAvm();notifyManualStop()}
function manualNextStop(){let i=nearestNext();manualStopIndex=Math.min(line.stops.length-1,i+1);lastAnnounced='';renderAvm();notifyManualStop()}
function notifyManualStop(){let i=nearestNext();if(i>=0){toast('Fermata selezionata: '+line.stops[i].name);if(audio)speak('Prossima fermata '+line.stops[i].name)}}
function renderAvm(){let ni=nearestNext();$('stopList').innerHTML='';line.stops.slice(Math.max(0,ni),Math.max(0,ni)+5).forEach((s,j)=>{let d=document.createElement('div');d.className='stopItem '+(j===0?'next':'');d.textContent=s.name;$('stopList').appendChild(d)});if(ni<0){$('nextName').textContent='Nessuna linea';return}let s=line.stops[ni];$('nextName').textContent=s.name;let meters=pos&&Number.isFinite(s.lat)&&Number.isFinite(s.lon)?Math.round(hav(pos.coords.latitude,pos.coords.longitude,s.lat,s.lon)):null;$('distance').textContent=meters===null?'GPS in attesa...':`Distanza dalla fermata: ${meters} m`;let delta=calcScheduleDelta(s);$('delta').textContent=delta.text;$('delta').className='delta '+delta.cls;if(audio&&meters!==null&&meters<250&&lastAnnounced!==s.name){speak('Prossima fermata '+s.name);lastAnnounced=s.name}}
function calcScheduleDelta(s){if(!s.time)return{text:'Orario non impostato',cls:'ontime'};let [h,m]=s.time.split(':').map(Number),now=new Date(),sched=new Date();sched.setHours(h,m,0,0);let min=Math.round((now-sched)/60000);if(min>1)return{text:`Ritardo +${min} min`,cls:'late'};if(min<-1)return{text:`Anticipo ${Math.abs(min)} min`,cls:'early'};return{text:'IN ORARIO',cls:'ontime'}}
function speak(t){if(!audio||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';speechSynthesis.speak(u)}
function toggleAudio(){audio=!audio;localStorage.setItem('avmAudio',audio?'on':'off');$('audioBtn').textContent=audio?'🔊 AUDIO ON':'🔇 AUDIO OFF';$('audioState').textContent=audio?'ATTIVO':'DISATTIVATO';$('audioState').className='diagVal '+(audio?'ok':'bad');if(audio)speak('Audio attivato')}
function initGps(){if(!navigator.geolocation){setGpsError('NON SUPPORTATO');return}if(navigator.permissions){navigator.permissions.query({name:'geolocation'}).then(p=>{updatePermission(p.state);p.onchange=()=>updatePermission(p.state)}).catch(()=>{})}watchId=navigator.geolocation.watchPosition(gotPos,e=>setGpsError(e.code===1?'PERMESSO NEGATO':e.code===2?'POSIZIONE NON DISPONIBILE':'TIMEOUT'),{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
function gotPos(p){pos=p;$('gpsState').textContent='ATTIVO';$('gpsState').className='diagVal ok';$('gpsLat').textContent=p.coords.latitude.toFixed(6);$('gpsLon').textContent=p.coords.longitude.toFixed(6);$('gpsAcc').textContent=Math.round(p.coords.accuracy)+' m';$('gpsSpeed').textContent=p.coords.speed==null?'--':Math.round(p.coords.speed*3.6)+' km/h';$('gpsTime').textContent=new Date(p.timestamp).toLocaleTimeString('it-IT');renderAvm();if(map)drawMap()}
function setGpsError(t){$('gpsState').textContent=t;$('gpsState').className='diagVal bad'} function updatePermission(s){let t=s==='granted'?'CONCESSO':s==='denied'?'NEGATO':'DA RICHIEDERE';$('gpsPermission').textContent=t;$('gpsPermission').className='diagVal '+(s==='granted'?'ok':s==='denied'?'bad':'warn')}
function initMap(){if(map||!window.L)return;map=L.map('map').setView([45.1847,9.1582],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map)}
function drawMap(){if(!map)return;if(routeLayer)routeLayer.remove();stopLayers.forEach(x=>x.remove());stopLayers=[];let pts=line.stops.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lon)).map(s=>[s.lat,s.lon]);if(pts.length){routeLayer=L.polyline(pts,{color:'#ff8a00',weight:5}).addTo(map);pts.forEach((p,i)=>stopLayers.push(L.marker(p).addTo(map).bindPopup(line.stops[i].name)));if(!pos)map.fitBounds(routeLayer.getBounds(),{padding:[30,30]})}if(pos){let p=[pos.coords.latitude,pos.coords.longitude];if(!busMarker)busMarker=L.circleMarker(p,{radius:9,color:'#fff',weight:3,fillColor:'#128cff',fillOpacity:1}).addTo(map);else busMarker.setLatLng(p)}}
function openPicker(i){pickIndex=i;picked=null;$('pickModal').classList.add('open');setTimeout(()=>{let s=line.stops[i],center=Number.isFinite(s.lat)&&Number.isFinite(s.lon)?[s.lat,s.lon]:pos?[pos.coords.latitude,pos.coords.longitude]:[45.1847,9.1582];if(!pickMap){pickMap=L.map('pickMap').setView(center,16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(pickMap);pickMap.on('click',e=>setPicked(e.latlng.lat,e.latlng.lng))}pickMap.setView(center,16);pickMap.invalidateSize();setPicked(center[0],center[1])},80)}
function setPicked(lat,lon){picked={lat,lon};if(!pickMarker)pickMarker=L.marker([lat,lon],{draggable:true}).addTo(pickMap);else pickMarker.setLatLng([lat,lon]);pickMarker.off('dragend');pickMarker.on('dragend',()=>{let p=pickMarker.getLatLng();picked={lat:p.lat,lon:p.lng}})}
function closePicker(){$('pickModal').classList.remove('open')} function confirmPicker(){if(pickIndex<0||!picked)return;line.stops[pickIndex].lat=+picked.lat.toFixed(6);line.stops[pickIndex].lon=+picked.lon.toFixed(6);closePicker();renderEditor();toast('Coordinate prese dalla mappa: premi SALVA LINEA')}
$('audioBtn').textContent=audio?'🔊 AUDIO ON':'🔇 AUDIO OFF';$('audioState').textContent=audio?'ATTIVO':'DISATTIVATO';renderEditor();renderAvm();initGps();setInterval(renderAvm,15000);
</script></body></html>
